# Konfigurasi deploy backend ke Koyeb (opsi tanpa kartu kredit).
#
# Deploy: `koyeb deploy . presensi-api` dari direktori backend, atau lewat
# dashboard Koyeb dengan "Builder: Dockerfile" dan Work directory = backend.
#
# Catatan:
# - `migrate --force` + `db:seed --force` sudah otomatis dijalankan oleh CMD di
#   Dockerfile, jadi tidak perlu command tambahan di sini.
# - Ganti nilai APP_URL di bawah setelah tahu domain service-nya.

name: presensi-api
type: web
dockerfile: Dockerfile
instance_type: nano
regions:
  - was
scaling:
  min: 1
  max: 1
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
health_checks:
  - grace_period: 30
    interval: 30
    restart_limit: 3
    timeout: 5
    tcp:
      port: 8000
env:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: "false"
