<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi gedung sekolah">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="towerDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Langit -->
  <rect width="800" height="1000" fill="url(#sky)"/>

  <!-- Bulan / cahaya -->
  <circle cx="640" cy="150" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="640" cy="150" r="42" fill="#ffffff" opacity="0.18"/>

  <!-- Gedung belakang -->
  <rect x="40" y="360" width="180" height="520" fill="url(#towerDark)" opacity="0.55"/>
  <g fill="#0f172a" opacity="0.5">
    <rect x="70" y="400" width="36" height="46"/>
    <rect x="126" y="400" width="36" height="46"/>
    <rect x="70" y="480" width="36" height="46"/>
    <rect x="126" y="480" width="36" height="46"/>
    <rect x="70" y="560" width="36" height="46"/>
    <rect x="126" y="560" width="36" height="46"/>
  </g>

  <!-- Gedung utama -->
  <rect x="250" y="260" width="320" height="620" fill="url(#tower)"/>
  <!-- Atap -->
  <polygon points="230,260 410,170 590,260" fill="#064e3b"/>
  <!-- Jam sekolah -->
  <circle cx="410" cy="222" r="20" fill="#f8fafc" stroke="#064e3b" stroke-width="5"/>
  <line x1="410" y1="222" x2="410" y2="210" stroke="#064e3b" stroke-width="4" stroke-linecap="round"/>
  <line x1="410" y1="222" x2="419" y2="227" stroke="#064e3b" stroke-width="4" stroke-linecap="round"/>

  <!-- Jendela gedung utama -->
  <g fill="#0f172a" opacity="0.75">
    <rect x="285" y="310" width="54" height="70" rx="4"/>
    <rect x="373" y="310" width="54" height="70" rx="4"/>
    <rect x="461" y="310" width="54" height="70" rx="4"/>
    <rect x="285" y="420" width="54" height="70" rx="4"/>
    <rect x="373" y="420" width="54" height="70" rx="4"/>
    <rect x="461" y="420" width="54" height="70" rx="4"/>
    <rect x="285" y="530" width="54" height="70" rx="4"/>
    <rect x="373" y="530" width="54" height="70" rx="4"/>
    <rect x="461" y="530" width="54" height="70" rx="4"/>
  </g>
  <!-- Sebagian jendela menyala -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="373" y="310" width="54" height="70" rx="4"/>
    <rect x="461" y="420" width="54" height="70" rx="4"/>
    <rect x="285" y="530" width="54" height="70" rx="4"/>
  </g>

  <!-- Pintu utama -->
  <rect x="378" y="740" width="64" height="140" rx="6" fill="#064e3b"/>
  <rect x="410" y="740" width="4" height="140" fill="#f8fafc" opacity="0.6"/>
  <rect x="352" y="720" width="116" height="24" rx="4" fill="#0f172a" opacity="0.8"/>

  <!-- Gedung kanan -->
  <rect x="600" y="430" width="170" height="450" fill="url(#towerDark)" opacity="0.7"/>
  <g fill="#0f172a" opacity="0.5">
    <rect x="628" y="470" width="40" height="52"/>
    <rect x="692" y="470" width="40" height="52"/>
    <rect x="628" y="556" width="40" height="52"/>
    <rect x="692" y="556" width="40" height="52"/>
    <rect x="628" y="642" width="40" height="52"/>
    <rect x="692" y="642" width="40" height="52"/>
  </g>

  <!-- Tanah -->
  <rect x="0" y="880" width="800" height="120" fill="#022c22"/>
  <!-- Jalan setapak -->
  <polygon points="360,1000 460,1000 435,880 385,880" fill="#0f172a" opacity="0.6"/>

  <!-- Pohon -->
  <g>
    <rect x="96" y="800" width="16" height="80" fill="#0f172a"/>
    <circle cx="104" cy="784" r="52" fill="#065f46"/>
    <circle cx="72" cy="806" r="36" fill="#064e3b"/>
    <circle cx="136" cy="806" r="36" fill="#047857"/>
  </g>
  <g>
    <rect x="676" y="812" width="14" height="68" fill="#0f172a"/>
    <circle cx="683" cy="796" r="46" fill="#065f46"/>
    <circle cx="654" cy="816" r="30" fill="#047857"/>
    <circle cx="712" cy="816" r="30" fill="#064e3b"/>
  </g>
</svg>
