# Blueprint Render: backend Laravel (API presensi) untuk demo.
#
# Cara pakai: Render Dashboard → New → Blueprint → pilih repo ini.
# Frontend (3 app Nuxt) tetap dideploy terpisah di Vercel.
#
# Catatan: Render tidak lagi menyediakan runtime PHP native untuk service baru,
# jadi backend dibungkus Docker (lihat backend/Dockerfile).
services:
  - type: web_service
    name: presensi-api
    runtime: docker
    plan: free
    repo: https://github.com/fresan4u/E-Presensi-for-School
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    # migrate + seed + serve dijalankan dari CMD di Dockerfile ($PORT dari Render).
